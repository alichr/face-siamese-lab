# Phase 3 gate: one full baseline run proving the whole measurement apparatus
# end to end. InfoNCE at plan §7 defaults.

seed: 0
output_dir: results/baseline_infonce

data:
  celeba_root: data/celeba
  splits_dir: data/splits
  augmentation: basic
  num_workers: 12
  debug_identities: null
  eval_split: val

model:
  backbone: resnet18
  embedding_dim: 128
  normalize: true
  pretrained: false

loss:
  name: infonce
  temperature: 0.07
  supcon: false

sampler:
  p: 64
  k: 4
  allow_replacement: false

train:
  epochs: 30
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  grad_clip: 5.0
  amp: bf16
  eval_every: 1
  batches_per_epoch: null
  full_eval: true
