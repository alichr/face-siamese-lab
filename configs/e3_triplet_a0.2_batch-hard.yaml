seed: 0
data:
  celeba_root: data/celeba
  splits_dir: data/splits
  augmentation: basic
  num_workers: 8
  debug_identities: null
  eval_split: val
model:
  backbone: resnet18
  embedding_dim: 128
  normalize: true
  pretrained: false
loss:
  name: triplet
  temperature: 0.07
  supcon: false
  negatives: local
  margin: 0.2
  miner: batch-hard
sampler:
  p: 64
  k: 4
  allow_replacement: false
train:
  epochs: 30
  lr: 0.0003
  weight_decay: 0.0001
  warmup_epochs: 5
  grad_clip: 5.0
  amp: bf16
  eval_every: 1
  batches_per_epoch: null
  full_eval: true
  sync_bn: true
output_dir: results/e3_triplet_a0.2_batch-hard
