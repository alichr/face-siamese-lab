# E5, global-negatives row (plan §10). The ONE torchrun job in the matrix.
#
#   .venv/bin/torchrun --nproc_per_node=3 -m src.engine.train --config configs/e5_global_ddp.yaml
#
# Per-rank batch 256 x 3 ranks = global batch 768 negatives per anchor, using
# the gradient-preserving gather validated by the Phase 4 gate.

seed: 0
output_dir: results/e5_global_768

data: {celeba_root: data/celeba, splits_dir: data/splits, augmentation: basic,
       num_workers: 8, debug_identities: null, eval_split: val}
model: {backbone: resnet18, embedding_dim: 128, normalize: true, pretrained: false}
loss:  {name: infonce, temperature: 0.07, supcon: false, negatives: global}
sampler: {p: 64, k: 4, allow_replacement: false}
train:
  epochs: 30
  lr: 3.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 5
  grad_clip: 5.0
  amp: bf16
  eval_every: 1
  batches_per_epoch: null
  full_eval: true
  sync_bn: true
